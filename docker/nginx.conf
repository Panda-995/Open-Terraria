server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Revalidate mutable files, including SW, build-id and asset manifests.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~ ^/assets-zip/p[0-9]+-[a-f0-9]+\.zip$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    # 云存档中继（docker/save-sync 服务,compose 同网络时生效;URI 原样透传,服务端
    # 自行消化 /sync 前缀）。upstream 用变量+resolver:解析推迟到请求时——web 镜像
    # 单独运行（无 sync 容器）时 nginx 仍能启动,/sync/* 只是 502,游戏本体零影响。
    # ^~ 压过下方静态正则;大世界 JSON 上传放宽体积上限。
    location ^~ /sync/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $sync_upstream http://open-terraria-sync:8787;
        proxy_pass $sync_upstream;
        proxy_http_version 1.1;
        client_max_body_size 512m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # Real 404s prevent missing assets from poisoning the Service Worker cache.
    location / {
        try_files $uri $uri/ =404;
    }
}
