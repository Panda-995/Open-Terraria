name: Build and publish save-sync image
on:
  push:
    branches: [main]
    paths:
      - 'docker/save-sync/**'
      - '.github/workflows/docker-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-sync" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build AMD64 image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: docker/save-sync
          platforms: linux/amd64
          load: true
          tags: save-sync:smoke
          cache-from: type=gha
      - name: Test AMD64 container
        shell: bash
        run: |
          docker run -d --name save-sync-smoke -p 8787:8787 -e SYNC_TOKEN=smoke-token save-sync:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/sync/config | grep -q '"tokenRequired":true'
          # 无令牌拒绝
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/sync/manifest)" = 401
          # 带令牌写读删全链路（键名含点与中文,经 URL 编码）
          KEY='sandboxworld.worlds.index'
          curl -fsS -X PUT -H 'x-sync-token: smoke-token' --data-binary '{"worlds":[1]}' "http://127.0.0.1:8787/sync/key/$KEY" | grep -q '"ok":true'
          curl -fsS -H 'x-sync-token: smoke-token' "http://127.0.0.1:8787/sync/key/$KEY" | grep -q '"worlds"'
          curl -fsS -H 'x-sync-token: smoke-token' http://127.0.0.1:8787/sync/manifest | grep -q "$KEY"
          # 槽位隔离
          test "$(curl -s -H 'x-sync-token: smoke-token' -H 'x-sync-slot: bob' http://127.0.0.1:8787/sync/manifest)" = '{"keys":{}}'
          # 路径穿越拒绝
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'x-sync-token: smoke-token' --data-binary x 'http://127.0.0.1:8787/sync/key/..%2F..%2Fetc')" = 400
          docker rm -f save-sync-smoke
      - name: Build and publish AMD64 and ARM64
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: docker/save-sync
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Open Terraria cloud save relay. See bundled LICENSE for upstream terms.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both published architectures
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > /tmp/save-sync-manifest.json
          node -e 'const m=require("/tmp/save-sync-manifest.json"); for(const arch of ["amd64","arm64"]) if(!m.manifests.some(x=>x.platform.os==="linux"&&x.platform.architecture===arch)) throw new Error("Missing "+arch)'
          echo "Published and verified: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
